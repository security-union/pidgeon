[package]
name = "pidgeon"
version = "1.0.1"
edition = "2024"
description = "PID controller with a filtered derivative, anti-windup and output limits. Pure no_std core plus a thread-safe wrapper."
authors = ["Dario Alessandro"]
repository = "https://github.com/security-union/pidgeon"
license = "MIT OR Apache-2.0"
publish = true
keywords = ["pid", "pid-controller", "control-systems", "robotics", "no-std"]
categories = ["science::robotics", "embedded", "no-std", "algorithms"]
readme = "../../README.md"

[dependencies]
web-time = { version = "1.1.0", optional = true }

[dev-dependencies]
criterion = "0.5"
ratatui = "0.29"
crossterm = "0.28"

[[bench]]
name = "pid_benchmark"
harness = false
required-features = ["benchmarks"]

[features]
default = ["std"]
std = []
benchmarks = ["std"]
wasm = ["std", "web-time"]
